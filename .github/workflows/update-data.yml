name: Mise à jour des données et publication de la page

on:
  schedule:
    - cron: "0 6 * * 1"  # tous les lundis à 6h UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installe les dépendances
        run: pip install -r requirements.txt

      - name: Télécharge et construit les données AN
        run: python -m votes_parlementaires.an.build

      - name: Classe les textes de loi par thème
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m votes_parlementaires.an.categorize

      - name: Régénère la page figée
        run: python -m votes_parlementaires.snapshots.deputes --departements 17 79 --out docs/index.html

      - name: Commit et push si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html votes_parlementaires/an/categories/
          if git diff --staged --quiet; then
            echo "Rien de nouveau à publier."
          else
            git commit -m "Mise à jour automatique des données (Action programmée)"
            git push
          fi
